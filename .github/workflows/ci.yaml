name: CI Pipeline

on:
  pull_request:
    branches:
      - main  # Only run tests on PRs to main (saves GitHub Actions minutes)

jobs:
  run-tests:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Install dependencies
        run: |
          poetry install

      - name: Run Pytest
        run: |
          poetry run pytest